name: Build Brisol APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare web assets
        run: |
          rm -rf dist
          mkdir -p dist

          if [ ! -f index.html ]; then
            echo "ERRO: index.html não encontrado na raiz do projeto."
            echo "Arquivos encontrados:"
            find . -maxdepth 2 -type f | sort | head -100
            exit 1
          fi

          cp index.html dist/

          for item in assets css js images img fonts; do
            if [ -e "$item" ]; then
              cp -r "$item" dist/
            fi
          done

          echo "Conteúdo do dist:"
          find dist -maxdepth 2 -type f | sort

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brisol-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
